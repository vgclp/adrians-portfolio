
name: Website veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Code herunterladen
        uses: actions/checkout@v4

      - name: Bun installieren
        uses: oven-sh/setup-bun@v2

      - name: Abhängigkeiten installieren
        run: bun install --frozen-lockfile

      - name: Website erstellen
        env:
          GITHUB_PAGES: "true"
        run: bun run build

      - name: Statische Website prüfen
        run: |
          bun scripts/verify-static-build.ts
          touch .output/public/.nojekyll
          ls -la .output/public

      - name: GitHub Pages konfigurieren
        uses: actions/configure-pages@v5

      - name: Dateien hochladen
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./.output/public

      - name: Website veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
